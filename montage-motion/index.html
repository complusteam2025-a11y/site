<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Être CM au Cameroun – Motion</title>
<style>
  :root{--or:#ff9f0a;--or2:#ff6a00;--g:#007a5e;--r:#ce1126;--y:#fcd116}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0b0b;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1125px;height:2000px;overflow:hidden;transform-origin:center;flex:none;
    font-family:"Arial Black","Impact",system-ui,sans-serif;background:#000}
  /* ---------- photo ---------- */
  #photo{position:absolute;inset:0;background:url(photo.jpg) center/cover;transform-origin:50% 45%;
    animation:kb 8s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.0) translateY(0)}to{transform:scale(1.09) translateY(-24px)}}
  #tint{position:absolute;inset:0;mix-blend-mode:soft-light;
    background:linear-gradient(160deg,rgba(255,159,10,.55),rgba(255,90,0,.15) 55%,rgba(0,0,0,.4));
    animation:tint 4s ease-in-out infinite alternate}
  @keyframes tint{to{opacity:.55}}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.65) 100%)}
  /* balayage lumineux */
  #sweep{position:absolute;top:-10%;bottom:-10%;width:260px;left:-400px;transform:skewX(-18deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
    animation:sweep 4s 1.4s ease-in-out infinite}
  @keyframes sweep{0%{left:-400px}55%,100%{left:1500px}}

  /* ---------- panneau flouté (masque l'ancien texte de la photo) ---------- */
  #panel{position:absolute;left:0;right:0;top:340px;height:490px;
    backdrop-filter:blur(34px) brightness(.55);-webkit-backdrop-filter:blur(34px) brightness(.55);
    background:linear-gradient(180deg,rgba(0,0,0,0),rgba(20,8,0,.6) 10%,rgba(20,8,0,.6) 85%,rgba(0,0,0,0));
    -webkit-mask:linear-gradient(180deg,transparent,#000 8%,#000 88%,transparent);
    mask:linear-gradient(180deg,transparent,#000 8%,#000 88%,transparent);
    opacity:0;animation:fadeIn .6s .1s forwards}
  @keyframes fadeIn{to{opacity:1}}

  /* ---------- titre ---------- */
  #title{position:absolute;left:0;right:0;top:425px;text-align:center;font-style:italic;font-weight:900;
    font-size:205px;line-height:1;letter-spacing:-5px;color:#fff;white-space:nowrap}
  #title .w{display:inline-block;margin:0 20px}
  #title .l{display:inline-block;opacity:0;transform:translateY(-500px) scale(2.4) rotate(-14deg);
    text-shadow:10px 10px 0 var(--or),0 0 60px rgba(255,159,10,.55);
    animation:slam .55s cubic-bezier(.2,1.5,.4,1) forwards, glow 2.6s 2.2s ease-in-out infinite}
  @keyframes slam{60%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes glow{50%{text-shadow:14px 14px 0 var(--or2),0 0 90px rgba(255,159,10,.95);transform:translateY(-8px)}}
  #title .l:nth-child(1){animation-delay:.35s,2.2s}
  #title .l:nth-child(2){animation-delay:.45s,2.3s}
  #title .l:nth-child(3){animation-delay:.55s,2.4s}
  #title .l:nth-child(4){animation-delay:.65s,2.5s}
  .w2 .l:nth-child(1){animation-delay:.85s,2.6s!important}
  .w2 .l:nth-child(2){animation-delay:.95s,2.7s!important}
  #shock{position:absolute;left:50%;top:560px;width:80px;height:80px;margin:-40px;border-radius:50%;
    border:10px solid var(--or);opacity:0;animation:shock 1s 1s ease-out infinite;animation-iteration-count:1}
  @keyframes shock{0%{transform:scale(.2);opacity:.9}100%{transform:scale(18);opacity:0}}

  #sub{position:absolute;left:0;right:0;top:665px;text-align:center;font-size:104px;font-style:italic;
    color:var(--or);letter-spacing:-2px;font-family:Georgia,"Times New Roman",serif;font-weight:900;
    clip-path:inset(0 100% 0 0);animation:wipe .8s 1.4s cubic-bezier(.7,0,.2,1) forwards;
    text-shadow:0 4px 30px rgba(0,0,0,.6)}
  @keyframes wipe{to{clip-path:inset(0 0 0 0)}}
  #underline{position:absolute;left:190px;top:790px;height:10px;width:0;border-radius:6px;
    background:linear-gradient(90deg,var(--g) 0 33%,var(--r) 33% 66%,var(--y) 66%);
    animation:ul .7s 2.1s ease-out forwards}
  @keyframes ul{to{width:640px}}

  #cest{position:absolute;left:560px;top:790px;font-size:88px;font-style:italic;color:#fff;
    font-family:Georgia,serif;font-weight:700;opacity:0;animation:pop .5s 2.5s cubic-bezier(.2,1.6,.4,1) forwards}
  #cest b{display:inline-block;color:var(--or);animation:wob 1.2s 3s ease-in-out infinite;transform-origin:50% 90%}
  @keyframes pop{from{opacity:0;transform:scale(.2) rotate(-20deg)}to{opacity:1;transform:none}}
  @keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}

  /* ---------- icônes flottantes ---------- */
  .ic{position:absolute;opacity:0;filter:drop-shadow(0 12px 22px rgba(0,0,0,.45))}
  .ic svg{width:100%;height:100%;display:block}
  .float{animation:in .6s var(--d) cubic-bezier(.2,1.6,.4,1) forwards,fl var(--t) calc(var(--d) + .6s) ease-in-out infinite}
  @keyframes in{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
  @keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-34px) rotate(calc(var(--r,0deg) + 8deg))}}

  /* cœurs qui montent */
  .heart{position:absolute;bottom:-120px;width:90px;height:90px;opacity:0;
    animation:rise var(--t) var(--d) linear infinite}
  .heart svg{width:100%;height:100%}
  @keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}10%{opacity:.95}
    50%{transform:translate(var(--x),-900px) scale(1)}100%{transform:translate(calc(var(--x)*-1),-1900px) scale(1.2);opacity:0}}

  /* notifications */
  .notif{position:absolute;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.95);color:#111;
    border-radius:60px;padding:16px 30px 16px 18px;font:700 38px system-ui,sans-serif;opacity:0;
    box-shadow:0 14px 40px rgba(0,0,0,.4)}
  .notif i{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:34px;color:#fff}
  .notif.a{left:60px;top:1040px;animation:toast 4s 3s ease-in-out infinite}
  .notif.b{right:50px;top:1160px;animation:toast 4s 4.3s ease-in-out infinite}
  @keyframes toast{0%{opacity:0;transform:translateY(60px) scale(.7)}8%{opacity:1;transform:none}
    30%{opacity:1}38%{opacity:0;transform:translateY(-50px)}100%{opacity:0}}

  /* compteur */
  #count{position:absolute;right:60px;top:1340px;text-align:right;color:#fff;opacity:0;
    animation:fadeIn .6s 3.4s forwards}
  #count .n{font-size:120px;line-height:1;color:var(--or);text-shadow:0 6px 30px rgba(0,0,0,.6)}
  #count .t{font:700 34px system-ui,sans-serif;letter-spacing:4px;text-transform:uppercase}

  /* bandeau bas */
  #lower{position:absolute;left:0;right:0;bottom:130px;display:flex;flex-direction:column;align-items:center;gap:26px}
  #tag{background:linear-gradient(90deg,var(--or),var(--or2));color:#fff;font-size:64px;font-style:italic;
    padding:16px 54px;transform:translateX(-1400px) skewX(-12deg);animation:slideIn .7s 2.8s cubic-bezier(.2,1,.3,1) forwards;
    box-shadow:0 12px 40px rgba(0,0,0,.45)}
  @keyframes slideIn{to{transform:translateX(0) skewX(-12deg)}}
  #tag span{display:inline-block;transform:skewX(12deg)}
  #swipe{font:800 40px system-ui,sans-serif;color:#fff;letter-spacing:6px;text-transform:uppercase;opacity:0;
    animation:fadeIn .5s 3.6s forwards;text-shadow:0 4px 20px rgba(0,0,0,.7)}
  #swipe .ar{display:block;text-align:center;font-size:64px;animation:bounce 1s ease-in-out infinite}
  @keyframes bounce{50%{transform:translateY(18px)}}

  /* bande drapeau haut */
  #flag{position:absolute;top:0;left:0;right:0;height:16px;display:flex;transform:scaleX(0);transform-origin:left;
    animation:flag 1s .1s ease-out forwards}
  #flag i{flex:1}
  @keyframes flag{to{transform:none}}

  /* étincelles */
  .sp{position:absolute;width:18px;height:18px;background:var(--or);border-radius:50%;opacity:0;
    animation:spark 2.4s var(--d) ease-out infinite}
  @keyframes spark{0%{opacity:0;transform:scale(0)}15%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}

  /* barre de progression (boucle 8 s) */
  #prog{position:absolute;left:0;bottom:0;height:8px;background:var(--or);width:0;animation:prog 8s linear infinite}
  @keyframes prog{to{width:100%}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="photo"></div>
  <div id="tint"></div>
  <div id="vig"></div>
  <div id="sweep"></div>
  <div id="flag"><i style="background:var(--g)"></i><i style="background:var(--r)"></i><i style="background:var(--y)"></i></div>

  <div id="panel"></div>
  <div id="shock"></div>
  <div id="title">
    <span class="w"><span class="l">Ê</span><span class="l">T</span><span class="l">R</span><span class="l">E</span></span>
    <span class="w w2"><span class="l">C</span><span class="l">M</span></span>
  </div>
  <div id="sub">au Cameroun</div>
  <div id="underline"></div>
  <div id="cest">C'est <b>?</b></div>

  <!-- icônes de community management -->
  <!-- cœur -->
  <div class="ic float" style="--d:1.6s;--t:3.2s;--r:-12deg;left:70px;top:230px;width:170px;height:170px">
    <svg viewBox="0 0 24 24"><path fill="#ff3b5c" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3 1.8-1.9 3.5-3 5.5-3 3.7 0 5.6 3.9 4.1 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
  <!-- bulle commentaire -->
  <div class="ic float" style="--d:1.9s;--t:3.6s;--r:10deg;right:70px;top:190px;width:190px;height:190px">
    <svg viewBox="0 0 24 24"><path fill="#fff" d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
    <circle cx="8" cy="10.5" r="1.4" fill="#ff9f0a"/><circle cx="12" cy="10.5" r="1.4" fill="#ff9f0a"/><circle cx="16" cy="10.5" r="1.4" fill="#ff9f0a"/></svg></div>
  <!-- play -->
  <div class="ic float" style="--d:2.2s;--t:3s;--r:-8deg;left:110px;top:900px;width:150px;height:150px">
    <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="5" fill="#ff0000"/><path fill="#fff" d="M10 8.5v7l6-3.5z"/></svg></div>
  <!-- hashtag -->
  <div class="ic float" style="--d:2.5s;--t:3.4s;--r:14deg;right:100px;top:930px;width:160px;height:160px">
    <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#ff9f0a"/><path stroke="#fff" stroke-width="2" stroke-linecap="round" d="M9 5 7 19M17 5l-2 14M5 9h15M4 15h15"/></svg></div>
  <!-- smartphone -->
  <div class="ic float" style="--d:2.8s;--t:3.8s;--r:-6deg;left:40px;top:1380px;width:150px;height:150px">
    <svg viewBox="0 0 24 24"><rect x="6" y="1.5" width="12" height="21" rx="2.5" fill="#222" stroke="#fff" stroke-width="1.3"/><rect x="8" y="4" width="8" height="14" rx="1" fill="#ff9f0a"/><circle cx="12" cy="20.3" r="1" fill="#fff"/></svg></div>
  <!-- statistiques -->
  <div class="ic float" style="--d:3.1s;--t:3.3s;--r:8deg;right:70px;top:1790px;width:150px;height:150px">
    <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#fff"/><rect x="4" y="13" width="4" height="7" rx="1" fill="#007a5e"/><rect x="10" y="8" width="4" height="12" rx="1" fill="#ce1126"/><rect x="16" y="4" width="4" height="16" rx="1" fill="#fcd116"/></svg></div>
  <!-- étoile (drapeau) -->
  <div class="ic float" style="--d:3.3s;--t:2.8s;--r:0deg;left:120px;top:1810px;width:110px;height:110px">
    <svg viewBox="0 0 24 24"><path fill="#fcd116" d="m12 1.5 3 6.9 7.5.7-5.6 5 1.7 7.4L12 17.6 5.4 21.5l1.7-7.4-5.6-5 7.5-.7z"/></svg></div>

  <!-- cœurs montants -->
  <div class="heart" style="--x:70px;--t:5s;--d:2.4s;left:180px"><svg viewBox="0 0 24 24"><path fill="#ff3b5c" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3 1.8-1.9 3.5-3 5.5-3 3.7 0 5.6 3.9 4.1 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
  <div class="heart" style="--x:-60px;--t:6s;--d:3.4s;left:560px;width:70px;height:70px"><svg viewBox="0 0 24 24"><path fill="#ff9f0a" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3 1.8-1.9 3.5-3 5.5-3 3.7 0 5.6 3.9 4.1 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
  <div class="heart" style="--x:80px;--t:5.5s;--d:4.2s;left:880px"><svg viewBox="0 0 24 24"><path fill="#ff3b5c" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3 1.8-1.9 3.5-3 5.5-3 3.7 0 5.6 3.9 4.1 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
  <div class="heart" style="--x:-90px;--t:6.5s;--d:5s;left:370px;width:110px;height:110px"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3 1.8-1.9 3.5-3 5.5-3 3.7 0 5.6 3.9 4.1 7.3C19.5 16.4 12 21 12 21z"/></svg></div>

  <!-- notifications -->
  <div class="notif a"><i style="background:#ff3b5c">♥</i>+1 250 j'aime</div>
  <div class="notif b"><i style="background:#007a5e">＋</i>Nouvel abonné</div>

  <!-- compteur -->
  <div id="count"><div class="n" id="num">0</div><div class="t">abonnés</div></div>

  <!-- étincelles autour du titre -->
  <div class="sp" style="--d:1.2s;--x:-160px;--y:-140px;left:130px;top:470px"></div>
  <div class="sp" style="--d:1.5s;--x:150px;--y:-160px;left:980px;top:480px"></div>
  <div class="sp" style="--d:2.0s;--x:-120px;--y:130px;left:210px;top:740px"></div>
  <div class="sp" style="--d:2.3s;--x:140px;--y:120px;left:900px;top:760px"></div>
  <div class="sp" style="--d:2.8s;--x:0;--y:-200px;left:560px;top:420px"></div>

  <div id="lower">
    <div id="tag"><span>COMMUNITY MANAGER</span></div>
    <div id="swipe">Découvre le métier<span class="ar">⌄</span></div>
  </div>
  <div id="prog"></div>
</div></div>

<script>
  // adapte la scène 1125×2000 à l'écran
  function fit(){const s=Math.min(innerWidth/1125,innerHeight/2000);document.getElementById('stage').style.transform='scale('+s+')'}
  addEventListener('resize',fit);fit();
  // compteur d'abonnés (boucle avec la barre de 8 s)
  function run(){const num=document.getElementById('num');const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/3500);
    num.textContent='+'+Math.round(12800*(1-Math.pow(1-p,3))).toLocaleString('fr-FR');
    if(p<1)requestAnimationFrame(f)})(t0)}
  setTimeout(run,3400);
  // relance toute l'animation toutes les 8 s pour une vraie boucle
  setInterval(()=>{const st=document.getElementById('stage'),c=st.cloneNode(true);st.replaceWith(c);fit();
    document.getElementById('num').textContent='0';setTimeout(run,3400)},8000);
</script>
</body>
</html>
